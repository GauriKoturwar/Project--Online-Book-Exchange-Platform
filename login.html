<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART-BookDeals - Login / Sign Up</title>
<link rel="stylesheet" href="login.css">
</head>

<body>

<nav>
  <div class="logo">SMART-BookDeals</div>
</nav>

<section id="auth-section">
  <div class="overlay"></div>

  <div class="auth-container">

    <!-- Tabs -->
    <input type="radio" id="tab-login" name="tab" checked>
    <input type="radio" id="tab-signup" name="tab">

    <div class="tab-buttons">
      <label for="tab-login">Login</label>
      <label for="tab-signup">Sign Up</label>
    </div>

    <!-- ✅ LOGIN FORM -->
    <form id="login-form" class="form" action="login.php" method="POST">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>

      <button type="submit" class="btn-submit">Login</button>
    </form>

    <!-- ✅ SIGNUP FORM -->
    <form id="signup-form" class="form" action="register.php" method="POST">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="username" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm-password" required>
      </div>

      <button type="submit" class="btn-submit">Sign Up</button>
    </form>

  </div>
</section>

</body>
</html>
